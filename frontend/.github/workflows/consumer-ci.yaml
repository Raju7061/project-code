name: Consumer CI/CD

on:
  push:
    branches:
      - main
      - RTR-consumer
    paths:
      - "consumer/**"
      - ".github/workflows/consumer-ci.yaml"

  workflow_dispatch:

env:
  IMAGE_NAME: 2024dock/cdc-consumer

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: consumer

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "TAG=v1.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "SHA_TAG=$SHORT_SHA" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: consumer/package-lock.json

      - name: Install Packages
        run: npm ci

      - name: Run Tests
        run: |
          npm test -- --passWithNoTests

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Consumer Image
        uses: docker/build-push-action@v6
        with:
          context: ./consumer
          file: ./consumer/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Version
        run: |
          echo "Consumer image pushed:"
          echo "${IMAGE_NAME}:${TAG}"