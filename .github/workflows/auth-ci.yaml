name: Auth Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: 2024dock/cdc-auth
  GITOPS_REPO: Raju7061/devops-project
  GITOPS_BRANCH: main

jobs:
  auth:
    name: Build Auth Image and Update GitOps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@v4

      - name: Generate Release Tags
        run: |
          echo "IMAGE_TAG=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v26.100.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Auth Image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            2024dock/cdc-auth:${{ env.IMAGE_TAG }}
            2024dock/cdc-auth:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout DevOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Auth Image in GitOps Values
        run: |
          cd gitops
          yq -i '."auth-service".image.tag = strenv(IMAGE_TAG)' minikube/auth-values.yaml
          yq -i '.global.releaseTag = strenv(RELEASE_TAG)' minikube/global-values.yaml

      - name: Commit and Push GitOps Changes
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minikube/auth-values.yaml minikube/global-values.yaml
          if git diff --cached --quiet; then
            echo "No GitOps changes detected."
            exit 0
          fi
          git commit -m "release(auth): ${IMAGE_TAG} -> ${RELEASE_TAG}"
          git push origin "$GITOPS_BRANCH"
