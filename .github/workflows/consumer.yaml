name: Consumer CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "consumer/**"
      - ".github/workflows/consumer-ci.yaml"

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: 2024dock/cdc-consumer
  GITOPS_REPO: Raju7061/devops-project
  GITOPS_BRANCH: RTR-postgres

jobs:
  consumer:
    name: Build Consumer Image and Update GitOps
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout Microservice Repository
      # ------------------------------------------------------------
      - name: Checkout Project Code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Generate Image Tag and Umbrella Release Tag
      # Example:
      # IMAGE_TAG   = v1.0.5
      # RELEASE_TAG = v26.100.5
      # ------------------------------------------------------------
      - name: Generate Tags
        run: |
          echo "IMAGE_TAG=v1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v26.100.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # Docker Buildx
      # ------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------
      # Login Docker Hub
      # ------------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------------------------
      # Build & Push ARM64 Image
      # ------------------------------------------------------------
      - name: Build and Push Consumer Image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./consumer
          file: ./consumer/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            2024dock/cdc-consumer:${{ env.IMAGE_TAG }}
            2024dock/cdc-consumer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------
      # Checkout GitOps Repository
      # ------------------------------------------------------------
      - name: Checkout DevOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.PAT_TOKEN }}
          path: gitops

      # ------------------------------------------------------------
      # Install yq
      # ------------------------------------------------------------
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # ------------------------------------------------------------
      # Update Consumer Helm Values
      # ------------------------------------------------------------
      - name: Update Consumer Image Tag in Helm Values
        run: |
          cd gitops

          # Consumer chart values
          yq -i '.image.tag = strenv(IMAGE_TAG)' \
            charts/raju-stack/charts/consumer/values.yaml

          # Minikube environment values
          yq -i '.image.tag = strenv(IMAGE_TAG)' \
            environments/minikube/consumer-values.yaml

          # Umbrella HelmRelease tag
          yq -i '.spec.values.global.releaseTag = strenv(RELEASE_TAG)' \
            releases/minikube.yaml

      # ------------------------------------------------------------
      # Commit and Push GitOps Changes
      # ------------------------------------------------------------
      - name: Commit GitOps Changes
        run: |
          cd gitops

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add charts/raju-stack/charts/consumer/values.yaml
          git add environments/minikube/consumer-values.yaml
          git add releases/minikube.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes detected."
            exit 0
          fi

          git commit -m "release(consumer): ${IMAGE_TAG} -> ${RELEASE_TAG}"
          git push origin ${GITOPS_BRANCH}

      # ------------------------------------------------------------
      # Deployment Summary
      # ------------------------------------------------------------
      - name: Deployment Summary
        run: |
          echo "Consumer Docker Image : ${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Umbrella Release Tag  : ${RELEASE_TAG}"
          echo "GitOps Repository      : ${GITOPS_REPO}"
          echo "GitOps Branch          : ${GITOPS_BRANCH}"